AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NewHome Clothes API

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref ListingsTable
        BUCKET_NAME: !Ref ImagesBucket

Resources:
  ListingsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  ListingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/listings/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ListingsTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref ListingsApi
            Path: /listings
            Method: GET
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref ListingsApi
            Path: /listings/{id}
            Method: GET
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref ListingsApi
            Path: /listings
            Method: POST

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/upload/
      Handler: index.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
      Events:
        GetUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref ListingsApi
            Path: /upload-url
            Method: POST

  ListingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: newhome-listings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub newhome-images-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT]
            AllowedOrigins: ['*']
            MaxAge: 3600

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${ImagesBucket}/*

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub https://${ListingsApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  BucketName:
    Description: S3 bucket for images
    Value: !Ref ImagesBucket
